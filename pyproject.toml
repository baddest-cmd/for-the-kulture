[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kulture-alignment"
version = "0.1.0"
authors = [
    { name="Shailoh" },
]
description = "Socio-Technical Recommender System Alignment for South African Music Cultures"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.2.0",
    "mlxtend>=0.22.0",
    "textblob>=0.17.1",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "prince>=0.13.0",
]

[project.optional-dependencies]
jax = [
    "jax>=0.4.10",
    "flax>=0.6.9",
]
dev = [
    "pytest>=7.0.0",
]
notebooks = [
    "altair>=5.0.0",
    "kmodes>=0.12.0",
    "statsmodels>=0.14.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
